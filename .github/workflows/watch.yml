name: room-watch

on:
  schedule:
    - cron: "*/20 * * * *"   # 20분마다 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:          # 수동 실행 버튼
    inputs:
      probe_dates:
        description: "점검용 날짜 (예: 2026-12-08,2026-12-10). 비우면 정상 감시"
        required: false
        default: ""

permissions:
  contents: write             # state.json(알림 이력) 저장용

concurrency:
  group: room-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 빈방 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROBE_DATES: ${{ inputs.probe_dates }}
          SOURCES: official          # 클라우드(해외 IP)는 네이버가 500이라 공식 사이트만
        run: |
          if [ -n "$PROBE_DATES" ]; then python watch.py --dry; else python watch.py; fi
      - name: 알림 이력 저장
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "room-watch-bot"
            git config user.email "room-watch-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u +%FT%TZ)" -q
            git push -q
          fi
